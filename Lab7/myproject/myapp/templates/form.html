<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  /* ตั้งค่าพื้นฐาน */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  /* กล่องฟอร์มหลัก */
  .form-container {
    background-color: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 400px;
  }

  h2 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
  }

  /* จัดระเบียบ Label และ Input */
  .form-group {
    margin-bottom: 15px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
  }

  input[type="text"],
  input[type="email"],
  select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box; /* สำคัญมาก: เพื่อให้ padding ไม่ดันขนาดกล่อง */
    font-size: 16px;
    transition: border-color 0.3s ease;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #4CAF50;
    box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
  }

  /* ปุ่มกด */
  input[type="submit"] {
    width: 100%;
    background-color: #4CAF50;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
    transition: background-color 0.3s ease;
  }

  input[type="submit"]:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>

<div class="form-container">
  <h2>บันทึกข้อมูลพนักงาน</h2>

  <form action="/action_page.php">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="ชื่อ-นามสกุล">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com">
    </div>

    <div class="form-group">
      <label for="position">Position</label>
      <select name="position" id="position">
        <option value="select">โปรดเลือกตำแหน่งที่ต้องการ</option>
        <option value="manager">ผู้จัดการ</option>
        <option value="sales">พนักงานขาย</option>
        <option value="it">ไอที</option>
      </select>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="text" id="phone" name="phone" placeholder="08x-xxx-xxxx">
    </div>

    <input type="submit" value="Submit">
  </form> 
</div>

</body>
</html>
