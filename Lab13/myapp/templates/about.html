{% extends "base.html" %}
{% block title %}
    <title>Nuttawut Saigoon</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif; 
            background-color: #f8f9fa;
        }

        .gallery-section {
            padding: 60px 0;
        }

        .section-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .section-subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ตกแต่งรูปภาพ */
        .img-wrapper {
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            margin-bottom: 24px;
        }

        .img-wrapper:hover {
            transform: translateY(-5px);
        }

        .img-wrapper img {
            width: 100%;
            height: 250px; /* กำหนดความสูงให้เท่ากันทุกรูป */
            object-fit: cover; /* ป้องกันภาพเบี้ยว */
            display: block;
        }

        /* ส่วนท้าย (Footer) */
        footer {
            background-color: #343a40;
            color: #ffffff;
            padding: 15px 0;
            font-size: 0.8rem;
            margin-top: 50px;
        }
    </style>
{% endblock %}

{% block content %}
    <section class="gallery-section container text-center">
        <h2 class="section-title">ภาพกิจกรรม</h2>
        <p class="section-subtitle">
            "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Delectus, minus. Corporis odio sit aliquam ex beatae a eveniet! Pariatur, ducimus?"
        </p>

        <div class="row">
            <div class="col-md-4 col-sm-6">
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?q=80&w=600" alt="Activity 1">
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
