<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}

    {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="/">Nuttawut Saigoon</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active text-white" aria-current="page" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/form">Form</a>
                    </li>        
                </ul>
            </div>
        </div>
    </nav>
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active position-relative">
                <img src="https://t3.ftcdn.net/jpg/02/43/61/90/360_F_243619030_eaTRO5kixe4sraiHd6DmOjsDHKQn8p4c.jpg" class="d-block w-100" alt="...">
                <!-- overlay caption occupying full slide for perfect centering -->
                <div class="carousel-caption d-flex flex-column justify-content-center align-items-center w-100 h-100 position-absolute top-0 start-0">
                    <div class="text-center px-3" style="padding: 2%; border-radius: 15px; background-color: rgba(0, 0, 0, 0.8);">
                        <h1 class="display-4 fw-bold text-white text-shadow">ยินดีต้อนรับเข้าสู่วิชา ICT12367</h1>
                        <p class="lead text-white text-shadow">การใช้กรอบงานสำหรับการพัฒนาเว็บแอปพลิเคชั่นเพื่อความมั่นคงปลอดภัย</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <br>
    <div>
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2024 ICT12367 SPU | Nuttawut Saigoon</p>
            <small class="text-muted">All rights reserved.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
